<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>미니 QR카드 23장 인쇄용 · 홍익대 1학년 체조2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .toolbar {
      width: 210mm;
      max-width: 100%;
      background: #0f172a;
      color: #fff;
      padding: 16px 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .toolbar input {
      flex: 1;
      min-width: 260px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
    }
    .toolbar button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-apply { background: #38bdf8; color: #082f49; }
    .btn-print { background: #facc15; color: #0b1120; }
    .toolbar-tip {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .toolbar-tip b { color: #facc15; }

    .page {
      width: 210mm;
      height: 297mm;
      background: #ffffff;
      padding: 10mm 10mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.16);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4mm;
      page-break-after: always;
      break-after: page;
    }
    .page:last-of-type {
      page-break-after: auto;
      break-after: auto;
    }

    .mini-card {
      border: 1.5px dashed #64748b;
      border-radius: 12px;
      padding: 5mm 6mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5mm;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }
    .mini-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4mm;
      background: #0f172a;
    }

    .card-left {
      padding-left: 3mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      flex: 1;
    }
    .card-course {
      font-size: 9pt;
      font-weight: 800;
      color: #475569;
      letter-spacing: -0.02em;
    }
    .card-num-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 2mm 0;
    }
    .card-num {
      font-size: 32pt;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }
    .card-emoji {
      font-size: 20pt;
    }
    .card-inst {
      font-size: 9.5pt;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.35;
      word-break: keep-all;
    }
    .card-lock-badge {
      display: inline-block;
      margin-top: 2mm;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
      font-size: 8pt;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      width: fit-content;
    }

    .card-qr {
      width: 44mm;
      height: 44mm;
      flex-shrink: 0;
      padding: 2mm;
      border: 2px solid #0f172a;
      border-radius: 10px;
      background: #fff;
    }
    .card-qr svg { width: 100%; height: 100%; display: block; }

    .guide-card {
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 6mm;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .guide-card h3 {
      margin: 0;
      font-size: 13pt;
      font-weight: 900;
      color: #0f172a;
    }
    .guide-card p {
      margin: 0;
      font-size: 9.5pt;
      color: #475569;
      line-height: 1.45;
      word-break: keep-all;
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: #fff; padding: 0; gap: 0; }
      .toolbar { display: none; }
      .page { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-row">
      <strong style="font-size:15px;">🃏 미니 QR카드 23장 (A4 3장 · 잠금 모드)</strong>
      <input type="text" id="base-input" placeholder="배포된 기본 주소 (예: https://hongik-gym.netlify.app/)" />
      <button class="btn-apply" id="btn-apply">23개 QR 일괄 생성</button>
      <button class="btn-print" onclick="window.print()">🖨️ A4 3장 인쇄 / PDF 저장</button>
    </div>
    <div class="toolbar-tip">
      ✂️ 점선을 따라 가위로 잘라 학생 23명에게 1장씩 나눠주세요. 각 카드 QR은 <b>자기 번호 1장만 열리고 다른 번호로 바꿀 수 없는 잠금 모드(&amp;lock=1)</b>로 연결됩니다!
    </div>
  </div>

  <div id="pages-root"></div>

  <script src="qr.js"></script>
  <script src="cards_data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const input = document.getElementById('base-input');
    const CARDS = window.MISSION_CARDS || [];

    const defaultBase = params.get('base') || window.location.href.replace(/mini_qr_cards\.html.*/, '');
    input.value = defaultBase;

    function normalizeBase(raw) {
      let s = (raw || '').trim();
      if (!s) return '';
      s = s.split('?')[0].split('#')[0];
      return s;
    }

    function renderPages(baseUrl) {
      const root = document.getElementById('pages-root');
      root.innerHTML = '';
      const cleanBase = normalizeBase(baseUrl);
      const perPage = 8;

      for (let p = 0; p < CARDS.length; p += perPage) {
        const page = document.createElement('div');
        page.className = 'page';
        const slice = CARDS.slice(p, p + perPage);

        slice.forEach((c) => {
          const cardUrl = `${cleanBase}?mode=student&card=${c.id}&lock=1`;
          const el = document.createElement('div');
          el.className = 'mini-card';
          let qrSvg = '';
          try {
            qrSvg = window.HongikQR.makeQRSvg(cardUrl, 2);
          } catch (e) {
            qrSvg = `<div style="font-size:10px;color:red;padding:6px;">${e.message}</div>`;
          }
          el.innerHTML = `
            <div class="card-left">
              <div class="card-course">홍익대 1학년 · 체조2</div>
              <div class="card-num-row">
                <span class="card-num">#${String(c.id).padStart(2, '0')}</span>
                <span class="card-emoji">${c.emoji}</span>
              </div>
              <div class="card-inst">📷 카메라로 스캔!<br>내 차례에 크게 읽기</div>
              <span class="card-lock-badge">🔒 ${c.id}번 전용 카드</span>
            </div>
            <div class="card-qr">${qrSvg}</div>
          `;
          page.appendChild(el);
        });

        // 3번째 페이지 마지막 24번째 칸은 교수님 안내 카드로 채움
        if (slice.length < perPage) {
          const guide = document.createElement('div');
          guide.className = 'guide-card';
          guide.innerHTML = `
            <h3>📋 교수님 진행 메모</h3>
            <p>① 이 23장을 잘라 1인당 1장씩 랜덤 배부<br>
               ② 학생이 QR 찍으면 본인 번호만 열림 (중복 0%)<br>
               ③ 앞 화면 룰렛 돌려서 걸린 번호 호명!<br>
               ④ Space(정답) → H(15초 멘트) → Enter(완료)</p>
            <p style="font-size:8pt;color:#64748b;word-break:break-all;">기준 주소: ${cleanBase}</p>
          `;
          page.appendChild(guide);
        }

        root.appendChild(page);
      }
    }

    document.getElementById('btn-apply').addEventListener('click', () => renderPages(input.value));
    renderPages(defaultBase);
  </script>
</body>
</html>
